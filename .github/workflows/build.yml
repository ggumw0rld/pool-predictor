name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip python3-dev build-essential \
          libssl-dev libffi-dev zlib1g-dev \
          openjdk-17-jdk git zip unzip \
          autoconf libtool pkg-config \
          libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libltdl-dev
        pip install buildozer cython==0.29.33

    - name: Accept Android licenses
      run: |
        mkdir -p $HOME/.android
        touch $HOME/.android/repositories.cfg
        yes | buildozer android debug 2>&1 | head -5 || true
        find $HOME/.buildozer -name "sdkmanager" 2>/dev/null | head -1 | xargs -I{} bash -c 'yes | {} --licenses' || true

    - name: Build APK
      run: |
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PoolPredictor-APK
        path: bin/*.apk
